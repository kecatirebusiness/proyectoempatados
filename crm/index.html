<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#504D13">
<title>CRM · Proyecto Empatados</title>
<link rel="icon" href="/giveaway/assets/logo.png">
<link rel="apple-touch-icon" href="/giveaway/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400,0..100,0..1&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#504D13;--olive-2:#5A5718;--olive-3:#45420F;--sage:#918E55;
  --pink:#FFDEE4;--pink-2:#D8B9C1;--sand:#EFE5D6;--ink:#3F3D0E;--ink-2:#6E6B27;
  --card:#FFF8F9;--line:rgba(80,77,19,.14);
  --nuevo:#2F6FDB;--contactado:#B7791F;--interesado:#8B5CF6;--ganador:#2F855A;--descartado:#8A8A8A;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--olive);color:var(--ink);font-family:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh;overflow-x:hidden}
.serif{font-family:"Fraunces",Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- login ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px);color:var(--pink);text-align:center;position:relative;overflow:hidden}
#login .glow{position:absolute;width:120vw;height:120vw;max-width:700px;max-height:700px;border-radius:50%;background:radial-gradient(circle,rgba(145,142,85,.55),transparent 65%);top:-30%;left:50%;transform:translateX(-50%);animation:breath 7s ease-in-out infinite;pointer-events:none}
@keyframes breath{50%{transform:translateX(-50%) scale(1.12)}}
.l-logo{width:110px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.25));animation:pop 1s var(--spring) both;position:relative}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
#login h1{font-size:40px;line-height:1;font-weight:600;margin:18px 0 6px;animation:rise .8s var(--ease) .15s both;position:relative}
#login h1 em{font-weight:400;color:var(--pink-2)}
#login p.sub{color:var(--pink-2);font-size:15px;animation:rise .8s var(--ease) .25s both;position:relative}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.l-card{width:100%;max-width:360px;margin-top:28px;background:var(--pink);color:var(--ink);border-radius:24px;padding:22px;text-align:left;
  box-shadow:0 30px 60px -20px rgba(20,19,4,.55);animation:rise .9s var(--ease) .35s both;position:relative}
.l-card label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pw{position:relative;margin:8px 0 6px}
.pw input{width:100%;height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:0 50px 0 16px;font-size:17px;font-weight:600;outline:none;transition:border-color .2s,box-shadow .2s}
.pw input:focus{border-color:var(--olive);box-shadow:0 0 0 5px rgba(80,77,19,.12)}
.pw button{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:18px}
.l-err{min-height:20px;font-size:13px;font-weight:700;color:#B4475A;margin-bottom:8px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.btn{width:100%;height:56px;border:0;border-radius:16px;background:var(--olive);color:var(--pink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--spring)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.7}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,222,228,.35);border-top-color:var(--pink);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.l-foot{margin-top:18px;font-size:12px;color:var(--pink-2);opacity:.75;position:relative}

/* ---------- app ---------- */
header.top{padding:calc(env(safe-area-inset-top) + 16px) 16px 18px;color:var(--pink);max-width:860px;margin:0 auto}
.bar1{display:flex;align-items:center;gap:12px}
.bar1 img{width:44px}
.bar1 h1{font-size:26px;font-weight:600;line-height:1;flex:1}
.bar1 h1 em{font-weight:400;color:var(--pink-2)}
.bar1 .last{display:block;font:500 12px/1.3 "Schibsted Grotesk",sans-serif;color:var(--pink-2);margin-top:3px;font-style:normal}
.ibtn{flex:none;height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1.5px solid rgba(255,222,228,.3);background:transparent;color:var(--pink);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:active{transform:scale(.95)}
.ibtn.spinning svg{animation:spin .8s linear infinite}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,222,228,.08);border:1px solid rgba(255,222,228,.14);border-radius:14px;padding:10px;animation:rise .6s var(--ease) both}
.stat b{display:block;font:600 26px/1 "Fraunces",serif;color:var(--pink);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:4px;font-size:11px;font-weight:700;color:var(--pink-2)}
main{background:var(--pink);border-radius:26px 26px 0 0;min-height:75dvh;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:860px;margin:0 auto}
.search{position:relative}
.search input{width:100%;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px 0 44px;font-size:16px;font-weight:600;outline:none}
.search input:focus{border-color:var(--olive)}
.search svg{position:absolute;left:15px;top:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all .25s var(--ease)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip i{font-style:normal;opacity:.65}
.chip.on{background:var(--olive);border-color:var(--olive);color:var(--pink)}
.meta-bar{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;font-size:13px;font-weight:700;color:var(--ink-2)}
.link{border:0;background:none;color:var(--olive);font-weight:800;font-size:13px;text-decoration:underline}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.lead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
  animation:rise .5s var(--ease) both;transition:transform .15s}
.lead:active{transform:scale(.985)}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--olive);color:var(--pink);font:700 15px/1 "Fraunces",serif}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who > span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.right{flex:none;text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.05);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.when{display:block;font-size:11px;color:var(--ink-2);margin-top:5px}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
.tag.dup{color:#B4475A;background:rgba(180,71,90,.1)}
.tag.nn{color:var(--ink-2);background:rgba(80,77,19,.08)}
.empty{text-align:center;padding:56px 20px;color:var(--ink-2)}
.empty b{display:block;font:600 22px/1.2 "Fraunces",serif;color:var(--ink);margin-bottom:6px}
.skel{height:68px;border-radius:16px;background:linear-gradient(90deg,#fbe9ec,#fff5f7,#fbe9ec);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- ficha del lead (hoja inferior) ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,29,8,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--pink);
  border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(105%);transition:transform .5s var(--ease);z-index:21;box-shadow:0 -20px 50px rgba(20,19,4,.3)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:rgba(80,77,19,.25);margin:4px auto 14px}
.s-head{display:flex;gap:14px;align-items:center}
.s-head .av{width:56px;height:56px;font-size:20px}
.s-head h2{font-size:24px;line-height:1.05;font-weight:600}
.s-head p{font-size:13px;color:var(--ink-2);margin-top:4px}
.s-close{margin-left:auto;align-self:flex-start;width:38px;height:38px;border-radius:50%;border:0;background:rgba(80,77,19,.08);font-size:18px}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.contact a,.contact button{height:62px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.contact a span,.contact button span{font-size:19px}
.contact .off{opacity:.35;pointer-events:none}
.sec{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 8px}
.estados{display:flex;flex-wrap:wrap;gap:8px}
.estados button{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:800;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:all .25s var(--spring)}
.estados button .dot{width:8px;height:8px;border-radius:50%}
.estados button.on{color:#fff;border-color:transparent;transform:scale(1.04)}
.estados button.on .dot{background:#fff!important}
.add{display:flex;gap:8px;align-items:flex-end}
.add textarea{flex:1;min-height:48px;max-height:140px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font-size:15px;line-height:1.35;resize:none;outline:none}
.add textarea:focus{border-color:var(--olive)}
.add button{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--olive);color:var(--pink);display:grid;place-items:center}
.add button:disabled{opacity:.6}
.notes{list-style:none;margin-top:12px;display:grid;gap:8px}
.notes li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;animation:rise .4s var(--ease) both}
.notes li small{display:block;font-size:11px;font-weight:700;color:var(--ink-2);margin-bottom:3px}
.notes .none{background:transparent;border:1.5px dashed var(--line);color:var(--ink-2);text-align:center}
.s-foot{margin-top:16px;font-size:12px;color:var(--ink-2);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,calc(100% + 60px));background:var(--ink);color:var(--pink);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .4s var(--spring);z-index:40;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}

@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.bar1 h1{font-size:22px}.bar1 img{width:38px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="glow" aria-hidden="true"></div>
  <img class="l-logo" src="/giveaway/assets/logo.png" alt="Proyecto Empatados">
  <h1 class="serif">CRM <em>privado</em></h1>
  <p class="sub">Solo para el equipo de Proyecto Empatados</p>
  <form class="l-card" id="loginForm" autocomplete="on">
    <input type="text" name="username" value="equipo" autocomplete="username" hidden>
    <label for="pw">Contraseña</label>
    <div class="pw">
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="peek" aria-label="Mostrar contraseña">👁</button>
    </div>
    <p class="l-err" id="lerr" role="alert"></p>
    <button class="btn" id="lbtn" type="submit"><span id="ltxt">Entrar</span></button>
  </form>
  <p class="l-foot">© Proyecto Empatados</p>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="bar1">
      <img src="/giveaway/assets/logo.png" alt="">
      <h1 class="serif">Leads <em>giveaway</em><i class="last" id="last"></i></h1>
      <button class="ibtn" id="reload" aria-label="Actualizar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
      <button class="ibtn" id="logout">Salir</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main><div class="wrap">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6B27" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar nombre, email o teléfono" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <div class="meta-bar"><span id="count"></span><button class="link" id="copy">Copiar emails</button></div>
    <div class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sName"></aside>
<div class="toast" id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwust9DBu-ZYQWH7ZMoFVop1q5qeo--RNLdhvvkR1rJsb4kMyB6bFi2lJZAYrQxhKyK/exec";
const KEY = "pe-crm-session";
const COLORS = {Nuevo:"var(--nuevo)",Contactado:"var(--contactado)",Interesado:"var(--interesado)",Ganador:"var(--ganador)",Descartado:"var(--descartado)"};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = {token:null, leads:[], estados:Object.keys(COLORS), filter:"Todos", q:"", open:null};

/* ---------- sesión ---------- */
function saveSession(token, secs) { try { localStorage.setItem(KEY, JSON.stringify({token, exp: Date.now() + secs*1000 - 60000})); } catch (e) {} }
function loadSession() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.exp > Date.now() ? s.token : null; } catch (e) { return null; } }
function clearSession() { try { localStorage.removeItem(KEY); } catch (e) {} }

async function api(body) {
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!d.ok && d.error === "SESION") { clearSession(); showLogin("Tu sesión expiró. Entra de nuevo."); throw new Error("SESION"); }
  if (!d.ok) throw new Error(d.error || "Error");
  return d;
}

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 2300); }

/* ---------- login ---------- */
function showLogin(msg) {
  S.token = null; closeSheet();
  $("#app").hidden = true; $("#login").hidden = false;
  $("#lerr").textContent = msg || "";
  setTimeout(() => $("#pw").focus(), 300);
}
$("#peek").onclick = () => { const i = $("#pw"); i.type = i.type === "password" ? "text" : "password"; };
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("#pw").value;
  if (!pw) return;
  const b = $("#lbtn"); b.disabled = true; $("#ltxt").innerHTML = '<span class="spin"></span>'; $("#lerr").textContent = "";
  try {
    const d = await api({action:"login", password: pw});
    saveSession(d.token, d.expira); S.token = d.token; $("#pw").value = "";
    enterApp();
  } catch (err) {
    if (err.message !== "SESION") {
      $("#lerr").textContent = err.message === "Failed to fetch" ? "Sin conexión. Intenta de nuevo." : err.message;
      const c = $(".l-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    }
  } finally { b.disabled = false; $("#ltxt").textContent = "Entrar"; }
});
$("#logout").onclick = () => { api({action:"logout", token:S.token}).catch(()=>{}); clearSession(); showLogin(); };

/* ---------- app ---------- */
function enterApp() { $("#login").hidden = true; $("#app").hidden = false; load(); }

async function load(quiet) {
  const rb = $("#reload"); rb.classList.add("spinning");
  try {
    const d = await api({action:"list", token:S.token});
    S.leads = d.leads.reverse(); S.estados = d.estados; render();
    if (quiet) toast("Actualizado");
  } catch (err) {
    if (err.message !== "SESION") $("#list").innerHTML = '<div class="empty"><b>No se pudo cargar</b>' + esc(err.message) + '</div>';
  } finally { rb.classList.remove("spinning"); }
}

function ago(iso) {
  if (!iso) return "";
  const d = new Date(iso), m = (Date.now() - d) / 6e4;
  if (m < 1) return "ahora"; if (m < 60) return Math.floor(m) + " min"; if (m < 1440) return Math.floor(m/60) + " h"; if (m < 10080) return Math.floor(m/1440) + " d";
  return d.toLocaleDateString("es", {day:"numeric", month:"short"});
}
const initials = n => (String(n).trim().split(/\s+/).slice(0,2).map(w => w[0] || "").join("") || "?").toUpperCase();
const notesOf = l => String(l.notas || "").split("\n").map(s => s.trim()).filter(Boolean);
const dupMap = () => S.leads.reduce((m, l) => (m[l.email.toLowerCase()] = (m[l.email.toLowerCase()] || 0) + 1, m), {});
function visible() {
  const q = S.q.toLowerCase().trim(), qd = q.replace(/\D/g, "");
  return S.leads.filter(l => (S.filter === "Todos" || l.estado === S.filter) &&
    (!q || (l.nombre + " " + l.email).toLowerCase().includes(q) || (qd.length >= 3 && l.telefono.replace(/\D/g, "").includes(qd))));
}

function render() {
  const L = S.leads, today = new Date().toDateString(), dups = dupMap();
  $("#last").textContent = L.length ? "Último registro hace " + ago(L[0].fecha) : "Aún no hay registros";
  $("#stats").innerHTML = [["Total", L.length], ["Únicos", Object.keys(dups).length], ["Hoy", L.filter(l => new Date(l.fecha).toDateString() === today).length], ["Sin contactar", L.filter(l => l.estado === "Nuevo").length]]
    .map(([k, v], i) => `<div class="stat" style="animation-delay:${i*.06}s"><b>${v}</b><span>${k}</span></div>`).join("");
  $("#chips").innerHTML = ["Todos"].concat(S.estados).map(e =>
    `<button class="chip${S.filter === e ? " on" : ""}" data-f="${esc(e)}">${e !== "Todos" ? `<span class="dot" style="background:${COLORS[e]}"></span>` : ""}${esc(e)}<i>${e === "Todos" ? L.length : L.filter(l => l.estado === e).length}</i></button>`).join("");
  const V = visible();
  $("#count").textContent = V.length + (V.length === 1 ? " persona" : " personas");
  if (!V.length) {
    $("#list").innerHTML = `<div class="empty"><b>${L.length ? "Sin resultados" : "Todavía no hay leads"}</b>${L.length ? "Prueba con otra búsqueda o filtro." : "Cuando alguien se registre en /giveaway aparecerá aquí."}</div>`;
    return;
  }
  $("#list").innerHTML = V.map((l, i) => {
    const n = notesOf(l).length;
    return `<button class="lead" data-row="${l.row}" style="animation-delay:${Math.min(i, 12) * .03}s">
      <span class="av">${esc(initials(l.nombre))}</span>
      <span class="who"><b>${esc(l.nombre)}${dups[l.email.toLowerCase()] > 1 ? '<span class="tag dup">DUPLICADO</span>' : ""}${n ? `<span class="tag nn">📝 ${n}</span>` : ""}</b>
      <span>${esc(l.email)}${l.telefono ? " · " + esc(l.telefono) : ""}</span></span>
      <span class="right"><span class="badge" style="color:${COLORS[l.estado] || "var(--ink-2)"}">${esc(l.estado)}</span><span class="when">${ago(l.fecha)}</span></span>
    </button>`;
  }).join("");
}

/* ---------- ficha ---------- */
function openSheet(row) {
  const l = S.leads.find(x => x.row === row); if (!l) return;
  S.open = row;
  const tel = l.telefono.replace(/[^\d+]/g, ""), wa = l.telefono.replace(/\D/g, "");
  const notes = notesOf(l).reverse();
  $("#sheet").innerHTML = `
    <div class="grab"></div>
    <div class="s-head">
      <span class="av">${esc(initials(l.nombre))}</span>
      <div><h2 class="serif" id="sName">${esc(l.nombre)}</h2><p>${esc(l.email)}${l.telefono ? "<br>" + esc(l.telefono) : ""}</p></div>
      <button class="s-close" id="sClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="contact">
      <a class="${wa ? "" : "off"}" href="https://wa.me/${wa}" target="_blank" rel="noopener"><span>💬</span>WhatsApp</a>
      <a class="${tel ? "" : "off"}" href="tel:${esc(tel)}"><span>📞</span>Llamar</a>
      <a href="mailto:${encodeURIComponent(l.email)}"><span>✉️</span>Email</a>
    </div>
    <p class="sec">Clasificación</p>
    <div class="estados">${S.estados.map(e => `<button data-estado="${esc(e)}" class="${l.estado === e ? "on" : ""}" style="${l.estado === e ? "background:" + COLORS[e] : ""}"><span class="dot" style="background:${COLORS[e]}"></span>${esc(e)}</button>`).join("")}</div>
    <p class="sec">Notas</p>
    <div class="add"><textarea id="nota" rows="1" placeholder="Agregar una nota…" maxlength="1000"></textarea>
      <button id="addNota" aria-label="Guardar nota"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <ul class="notes" id="notes">${notes.length ? notes.map(noteHTML).join("") : '<li class="none">Sin notas todavía</li>'}</ul>
    <p class="s-foot">Registrado el ${l.fecha ? new Date(l.fecha).toLocaleString("es", {dateStyle:"long", timeStyle:"short"}) : "—"} · ${esc(l.fuente || "giveaway")}</p>`;
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0;
  const ta = $("#nota");
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#addNota").click(); });
}
function noteHTML(line) {
  const m = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}) · (.*)$/);
  if (!m) return `<li>${esc(line)}</li>`;
  const d = new Date(m[1].replace(" ", "T"));
  return `<li><small>${isNaN(d) ? esc(m[1]) : d.toLocaleString("es", {dateStyle:"medium", timeStyle:"short"})}</small>${esc(m[2])}</li>`;
}
function closeSheet() { S.open = null; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-f],.lead,#sClose,[data-estado],#addNota");
  if (!t) return;
  if (t.dataset.f) { S.filter = t.dataset.f; render(); return; }
  if (t.classList.contains("lead")) { openSheet(+t.dataset.row); return; }
  if (t.id === "sClose") { closeSheet(); return; }
  const l = S.leads.find(x => x.row === S.open); if (!l) return;
  if (t.dataset.estado) {
    const nuevo = t.dataset.estado, antes = l.estado; if (nuevo === antes) return;
    l.estado = nuevo;
    document.querySelectorAll("[data-estado]").forEach(b => { const on = b.dataset.estado === nuevo; b.classList.toggle("on", on); b.style.background = on ? COLORS[nuevo] : ""; });
    render();
    try { await api({action:"estado", token:S.token, row:l.row, email:l.email, estado:nuevo}); toast("Clasificado como " + nuevo); }
    catch (err) { if (err.message !== "SESION") { l.estado = antes; render(); openSheet(l.row); toast(err.message); } }
    return;
  }
  if (t.id === "addNota") {
    const ta = $("#nota"), txt = ta.value.trim(); if (!txt) { ta.focus(); return; }
    t.disabled = true;
    try {
      const d = await api({action:"nota", token:S.token, row:l.row, email:l.email, texto:txt});
      l.notas = d.notas; ta.value = ""; ta.style.height = "";
      $("#notes").innerHTML = notesOf(l).reverse().map(noteHTML).join("");
      render(); toast("Nota guardada");
    } catch (err) { if (err.message !== "SESION") toast(err.message); }
    finally { t.disabled = false; }
  }
});
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#q").addEventListener("input", e => { S.q = e.target.value; render(); });
$("#reload").onclick = () => load(true);
$("#copy").onclick = () => {
  const em = [...new Set(visible().map(l => l.email))];
  if (!em.length) return toast("No hay emails");
  navigator.clipboard.writeText(em.join(", ")).then(() => toast(em.length + " emails copiados"));
};
setInterval(() => { if (S.token && !document.hidden && S.open === null) load(); }, 60000);

/* ---------- inicio ---------- */
S.token = loadSession();
if (S.token) enterApp(); else showLogin();
</script>
</body>
</html>
